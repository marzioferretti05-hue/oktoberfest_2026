<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Anti-cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Donazione - Il Gruppo</title>

  <!-- CSS con versione anti-cache -->
  <link rel="stylesheet" href="styles.css?v=1010" />
</head>
<body>

  <!-- Pulsanti lingua e Home -->
  <div class="lang-buttons">
    <button onclick="location.href='index.html'">← Home</button>
    <button onclick="setLanguage('it')">IT</button>
    <button onclick="setLanguage('en')">EN</button>
    <button onclick="setLanguage('de')">DE</button>
  </div>

  <div class="container">

    <!-- Header con Logo Piccolo -->
    <header class="hero small-hero">
      <a href="index.html">
        <img src="immagini/logo.jpeg" alt="Logo" class="site-logo small-logo" />
      </a>
    </header>

    <!-- Titolo della Sezione -->
    <h2 class="section-title" id="donation-title">Offrici una Birra</h2>

    <!-- Immagine centrale -->
    <img src="immagini/boccale.jpeg" alt="Donazione" class="person-img" />

    <!-- Box scheda descrizione -->
    <div class="person-description-box">
      <p class="person-description" id="donation-text">
        <span class="dropcap">S</span>e desideri sostenere la causa e rifornire i nostri boccali all'Oktoberfest, qui sotto trovi il link diretto per inviarci un piccolo contributo. Come promesso, non verrà usato per cause nobili ma per mantenere alto il livello di luppolo!
      </p>

      <!-- Link esterno per il pagamento -->
      <div style="text-align: center; margin-top: 25px; display: flex; flex-direction: column; gap: 12px; align-items: center;">
        <a href="https://revolut.me/marzio05" target="_blank" style="background: #000000; color: white; padding: 10px 24px; border-radius: 20px; text-decoration: none; font-weight: bold; font-family: sans-serif; width: 80%; max-width: 260px; display: inline-block;">
          Revolut
        </a>
      </div>
    </div>

    <footer>© 2026 Il Gruppo</footer>

  </div>

  <!-- Script per le traduzioni -->
  <script>
    const translations = {
      it: {
        title: "Offrici una Birra",
        text: '<span class="dropcap">S</span>e desideri sostenere la causa e rifornire i nostri boccali all\'Oktoberfest, qui sotto trovi il link diretto per inviarci un piccolo contributo. Come promesso, non verrà usato per cause nobili ma per mantenere alto il livello di luppolo!'
      },
      en: {
        title: "Buy Us a Beer",
        text: '<span class="dropcap">I</span>f you want to support the cause and refill our beer mugs at Oktoberfest, below you\'ll find the direct link to send us a small contribution. As promised, it won\'t be used for noble causes, just to keep the hops flowing!'
      },
      de: {
        title: "Spendier uns ein Bier",
        text: '<span class="dropcap">W</span>enn du unser Vorhaben unterstützen und unsere Bierkrüge auf dem Oktoberfest nachfüllen möchtest, findest du unten den direkten Link für eine kleine Spende. Wie versprochen wird das Geld für keine edlen Zwecke verwendet, sondern nur um den Hopfenpegel hoch zu halten!'
      }
    };

    function setLanguage(lang) {
      document.getElementById("donation-title").textContent = translations[lang].title;
      document.getElementById("donation-text").innerHTML = translations[lang].text;
    }
  </script>

</body>
</html>
